name: CI

# Every pull request and every push to main runs the engine's tests (no model needed) and builds the
# site from the lockfile. Publishing is separate: after a pull request merges, the owner runs
# `npm run deploy` from ui/ (see ui/wrangler.jsonc). Actions are pinned to a commit; Dependabot
# proposes the newer ones.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest

  site:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The preview step runs TypeScript with Node itself, which needs 22.18 or newer;
          # check-latest makes sure the runner's cached 22 is not older.
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
